<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Wise Mind Maps - E-chemEd</title>
    <link rel="stylesheet" href="MindMap.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="navbar">
            <a href="HomePage.html" class="click">
                <div class="nav-logo">
                    <div class="logo">Home</div>
                    <span class="brand-tag">E-chemEd</span>
                </div>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="page-header">
            <h1>Unit Wise Mind Maps</h1>
            <p>Select a chemistry unit below to open its interactive mind map.</p>
        </div>

        <div class="units-list">
            <form action="unit1 mind maps.pdf" method="get" class="unit-form">
                <button type="submit" class="unit-btn">
                    <span class="unit-badge">UNIT 1</span>
                    <span class="unit-title">Water Processing and Environmental Sustainability.</span>
                </button>
            </form>

            <form action="" method="get" class="unit-form">
                <button type="submit" class="unit-btn">
                    <span class="unit-badge">UNIT 2</span>
                    <span class="unit-title">Electrochemical Energy Storage Systems</span>
                </button>
            </form>

            <form action="" method="get" class="unit-form">
                <button type="submit" class="unit-btn">
                    <span class="unit-badge">UNIT 3</span>
                    <span class="unit-title">Flexible Electronics &amp; Optoelectronic Materials</span>
                </button>
            </form>

            <form action="" method="get" class="unit-form">
                <button type="submit" class="unit-btn">
                    <span class="unit-badge">UNIT 4</span>
                    <span class="unit-title">Nanomaterials, Electrochemistry And Thermal Analysis</span>
                </button>
            </form>

            <form action="" method="get" class="unit-form">
                <button type="submit" class="unit-btn">
                    <span class="unit-badge">UNIT 5</span>
                    <span class="unit-title">Energy Generation And Sustainable Fuels</span>
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 E-chemEd. All rights reserved.</p>
    </footer>

</body>
</html>

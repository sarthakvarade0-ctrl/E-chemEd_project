<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance - E-chemEd</title>
    <link rel="stylesheet" href="attendence.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="navbar">
            <a href="HomePage.html" class="click">
                <div class="nav-logo">
                    <div class="logo">Home</div>
                    <span class="brand-tag">E-chemEd</span>
                </div>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="page-header">
            <h1>Attendance Portal</h1>
            <p>Mark daily attendance, review records, or configure attendance limits.</p>
        </div>

        <div class="actions-list">
            <form action="https://docs.google.com/forms/d/e/1FAIpQLSen4-5kFtT4ZAE6RK8iec3VKdle6qjiXHEQiCgTmIjTjb0XOQ/viewform?usp=publish-editor" method="get" class="action-form">
                <button type="submit" class="action-btn">
                    <span class="action-badge">OPTION 1</span>
                    <span class="action-title">Mark Attendance</span>
                </button>
            </form>

            <form action="https://docs.google.com/spreadsheets/d/1au_3NtotiZS2T7O2YNEtFN3dCK6AhTVea34Dvf3Qg_8/edit?usp=sharing" method="get" class="action-form">
                <button type="submit" class="action-btn">
                    <span class="action-badge">OPTION 2</span>
                    <span class="action-title">View Attendance</span>
                </button>
            </form>

            <form action="https://docs.google.com/forms/d/1437-nI6jN6fEMLTFvHx5Xl6wctNUASBP_rzortQzwww/edit" method="get" class="action-form">
                <button type="submit" class="action-btn">
                    <span class="action-badge">OPTION 3</span>
                    <span class="action-title">Set Limiter (only for faculty)</span>
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 E-chemEd. All rights reserved.</p>
    </footer>

</body>
</html>
